[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naive-bench"
version = "0.1.0"
description = "Naive Docker/local benchmark harness for assembly + optional C/C++ baselines"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
naive-bench = "naive_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["naive_bench"]
